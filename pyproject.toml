[project]
name = "rag-system"
version = "0.1.0"
description = "A simple RAG system using ChromaDB, LlamaIndex, LangChain, and Gradio"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.coverage.run]
source = ["rag"]
omit = ["tests/*"]
